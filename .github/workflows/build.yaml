name: Build promgithub

on:
  schedule:
    - cron: '0 15 * * 0'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  fast-pr-lane:
    name: Fast PR lane
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Golang
        uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: .go-version

      - name: Install Tools and Dependencies
        run: make install_tools

      - name: Lint
        run: make lint

      - name: Security Scan
        run: make security

      - name: Build
        run: make build

      - name: Unit Tests
        run: make unit-test

      - name: In-process Integration Tests
        run: make integration-test

      - name: Coverage
        run: make coverage

  medium-redis-lane:
    name: Medium Redis lane
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        id: environment
        run: |
          echo "PROMGITHUB_REDIS_ADDR=127.0.0.1:6379" >> $GITHUB_ENV

      - name: Set up Golang
        uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: .go-version

      - name: Install Tools and Dependencies
        run: make deps

      - name: Redis Integration Tests
        run: make redis-integration-test

  deep-container-lane:
    name: Deep container lane
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        id: environment
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "DOCKER_CLI_EXPERIMENTAL=enabled" >> $GITHUB_ENV

      - name: Set up Golang
        uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: .go-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Tools and Dependencies
        run: make install_tools

      - name: Build Container
        run: make container

      - name: Container Security Scan
        run: make container-security
